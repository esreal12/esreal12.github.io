server {
  listen 80;
  server_name work.soluciondigital.cr;

  root /var/www/work.soluciondigital.cr;
  index index.html;

  location /_astro/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
